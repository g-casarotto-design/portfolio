<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portfolio</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    .iframe-container {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Version mobile */
    @media (max-width: 768px) {
      .iframe-container {
        height: 100vh;
        width: 100%;
      }
      iframe {
        width: 100%;
        height: 100%;
      }
    }

    /* Version ordinateur */
    @media (min-width: 769px) {
      .iframe-container {
        width: 80%;
        height: 90vh;
        margin: 0 auto;
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
      }
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe src="Gustavo_CASAROTTO_Portfolio.pdf"></iframe>
  </div>
</body>
</html>
