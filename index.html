<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      overflow: hidden; /* Empêche le scroll */
    }

    .container {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    /* Styles pour desktop */
    .pdf-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Page mobile fixe avec image */
    .mobile-view {
      display: none;
      height: 100vh;
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
      position: fixed;
      top: 0;
      left: 0;
    }

    .portfolio-preview {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      padding: 20px;
      max-width: 300px;
      width: 90%;
    }

    .portfolio-image {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .mobile-content h2 {
      color: white;
      font-size: 24px;
      margin-bottom: 15px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .mobile-content p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .open-pdf-btn {
      display: inline-block;
      padding: 15px 30px;
      background-color: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
      border: 2px solid transparent;
    }

    .open-pdf-btn:hover {
      background-color: #218838;
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(40, 167, 69, 0.4);
    }

    .open-pdf-btn:active {
      transform: translateY(-1px);
    }

    /* Media queries pour mobile */
    @media screen and (max-width: 768px) {
      .pdf-container {
        display: none;
      }
      
      .mobile-view {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Vue desktop avec iframe -->
    <div class="pdf-container">
      <iframe 
        src="Gustavo_CASAROTTO_Portfolio.pdf#toolbar=1&navpanes=0&scrollbar=1&page=1&view=FitH" 
        title="Portfolio de Gustavo Casarotto"
        loading="lazy">
      </iframe>
    </div>
    
    <!-- Vue mobile avec image et bouton -->
    <div class="mobile-view">
      <div class="portfolio-preview">
        <img src="portfolio-preview.jpg" alt="Portfolio Preview" class="portfolio-image" 
             onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgZmlsbD0iI2Y4ZjlmYSIvPjx0ZXh0IHg9IjE1MCIgeT0iMjAwIiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM2Yzc1N2QiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkd1c3Rhdm8gQ0FTQVJPVFRPPC90ZXh0Pjx0ZXh0IHg9IjE1MCIgeT0iMjMwIiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiM2Yzc1N2QiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlBvcnRmb2xpbzwvdGV4dD48L3N2Zz4='">
      </div>
      
      <div class="mobile-content">
        <h2>📱 Mobile Version</h2>
        <p>Tap the button below to open the portfolio in your device's PDF viewer for the best experience.</p>
        <a href="Gustavo_CASAROTTO_Portfolio.pdf" class="open-pdf-btn" target="_blank">
          📄 Open Portfolio
        </a>
      </div>
    </div>
  </div>

</body>
