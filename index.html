<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    .container {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    /* Styles pour desktop */
    .pdf-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Bouton de téléchargement de secours */
    .download-fallback {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 30px 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      max-width: 350px;
      width: 90%;
    }

    .portfolio-image {
      width: 100%;
      max-width: 250px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .language-section {
      margin-bottom: 25px;
    }

    .language-section h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #333;
    }

    .language-section p {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .download-btn {
      display: inline-block;
      padding: 12px 25px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      margin: 5px;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
    }

    .download-btn:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
    }

    /* Media queries pour mobile */
    @media screen and (max-width: 768px) {
      .container {
        padding: 10px;
      }
      
      iframe {
        min-height: 80vh;
      }
      
      /* Afficher le bouton de téléchargement sur très petits écrans */
      .download-fallback {
        display: block;
        position: static;
        transform: none;
        margin: 20px auto;
        max-width: 300px;
      }
      
      .pdf-container {
        height: auto;
        min-height: 80vh;
      }
    }

    @media screen and (max-width: 480px) {
      .container {
        padding: 5px;
      }
      
      iframe {
        min-height: 70vh;
      }
      
      .download-fallback h2 {
        font-size: 18px;
      }
      
      .download-fallback p {
        font-size: 14px;
      }
    }

    /* Styles pour améliorer l'affichage PDF sur mobile */
    @media screen and (max-width: 768px) {
      iframe {
        -webkit-overflow-scrolling: touch;
        overflow: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pdf-container">
      <iframe 
        src="Gustavo_CASAROTTO_Portfolio.pdf#toolbar=1&navpanes=0&scrollbar=1&page=1&view=FitH" 
        title="Portfolio de Gustavo Casarotto"
        loading="lazy">
      </iframe>
    </div>
    
    <!-- Bouton de téléchargement de secours pour mobile -->
    <div class="download-fallback">
      <h2>📱 Version Mobile</h2>
      <p>Pour une meilleure expérience sur mobile, téléchargez directement le PDF :</p>
      <a href="Gustavo_CASAROTTO_Portfolio.pdf" class="download-btn" download>
        📥 Télécharger le Portfolio
      </a>
    </div>
  </div>

  <script>
    // Script pour détecter si le PDF se charge correctement sur mobile
    window.addEventListener('load', function() {
      const iframe = document.querySelector('iframe');
      const fallback = document.querySelector('.download-fallback');
      
      // Sur mobile, vérifier si l'iframe est bien supportée
      if (window.innerWidth <= 768) {
        iframe.addEventListener('error', function() {
          iframe.style.display = 'none';
          fallback.style.display = 'block';
        });
        
        // Timeout pour afficher le fallback si le PDF ne se charge pas
        setTimeout(function() {
          if (iframe.contentDocument === null) {
            fallback.style.display = 'block';
          }
        }, 3000);
      }
    });
  </script>
</body>
</html>
